<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="900" fill="white"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2,8 L8,2" stroke="black" stroke-width="1.5"/>
    </marker>
  </defs>
  <!-- fordelt last 4 kN/m -->
  <line x1="150" y1="120" x2="750" y2="120" stroke="black" stroke-width="1.5"/>
  <g stroke="black" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="150" y1="120" x2="150" y2="196"/><line x1="210" y1="120" x2="210" y2="196"/>
    <line x1="270" y1="120" x2="270" y2="196"/><line x1="330" y1="120" x2="330" y2="196"/>
    <line x1="390" y1="120" x2="390" y2="196"/><line x1="450" y1="120" x2="450" y2="196"/>
    <line x1="510" y1="120" x2="510" y2="196"/><line x1="570" y1="120" x2="570" y2="196"/>
    <line x1="630" y1="120" x2="630" y2="196"/><line x1="690" y1="120" x2="690" y2="196"/>
    <line x1="750" y1="120" x2="750" y2="196"/>
  </g>
  <text x="450" y="108" text-anchor="middle" font-size="22">q = 4 kN/m</text>
  <!-- punktlast 10 kN -->
  <line x1="350" y1="30" x2="350" y2="196" stroke="black" stroke-width="3" marker-end="url(#ah)"/>
  <text x="362" y="48" font-size="22">10 kN</text>
  <!-- bjelke -->
  <rect x="150" y="200" width="600" height="14" fill="#ddd" stroke="black" stroke-width="2"/>
  <!-- fastlager A -->
  <path d="M150,214 L128,252 L172,252 Z" fill="white" stroke="black" stroke-width="2"/>
  <line x1="115" y1="252" x2="185" y2="252" stroke="black" stroke-width="2"/>
  <g stroke="black" stroke-width="1.2"><line x1="120" y1="262" x2="130" y2="252"/><line x1="135" y1="262" x2="145" y2="252"/><line x1="150" y1="262" x2="160" y2="252"/><line x1="165" y1="262" x2="175" y2="252"/></g>
  <text x="120" y="232" font-size="24" font-weight="bold" text-anchor="end">A</text>
  <!-- rullelager B -->
  <path d="M750,214 L728,244 L772,244 Z" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="736" cy="250" r="6" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="764" cy="250" r="6" fill="white" stroke="black" stroke-width="2"/>
  <line x1="715" y1="257" x2="785" y2="257" stroke="black" stroke-width="2"/>
  <g stroke="black" stroke-width="1.2"><line x1="720" y1="267" x2="730" y2="257"/><line x1="735" y1="267" x2="745" y2="257"/><line x1="750" y1="267" x2="760" y2="257"/><line x1="765" y1="267" x2="775" y2="257"/></g>
  <text x="782" y="232" font-size="24" font-weight="bold">B</text>
  <!-- mål -->
  <g stroke="black" stroke-width="1.2">
    <line x1="150" y1="285" x2="150" y2="345"/><line x1="350" y1="285" x2="350" y2="345"/><line x1="750" y1="285" x2="750" y2="395"/><line x1="150" y1="355" x2="150" y2="395"/>
    <line x1="150" y1="330" x2="750" y2="330" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="350" y1="330" x2="350" y2="330" marker-end="url(#dim)"/>
    <line x1="150" y1="385" x2="750" y2="385" marker-start="url(#dim)" marker-end="url(#dim)"/>
  </g>
  <text x="250" y="322" text-anchor="middle" font-size="22">2,0 m</text>
  <text x="550" y="322" text-anchor="middle" font-size="22">4,0 m</text>
  <text x="450" y="377" text-anchor="middle" font-size="22">6,0 m</text>
</svg>
